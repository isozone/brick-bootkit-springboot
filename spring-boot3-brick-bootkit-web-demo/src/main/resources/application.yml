server:
  port: 8080

spring:
  thymeleaf:
    cache: false
    mode: HTML
  autoconfigure:
    exclude:
      # 排除 brick-bootkit 自动配置
      # 排除不需要的自动配置
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

logging:
  level:
    com.zqzqq.bootkits: DEBUG
    org.springframework.web: INFO
    org.springframework.boot: DEBUG


plugin:
  enable: true
  main-package: com.zqzqq.bootkits.web.demo.DemoApplication
  plugin-path:
    - D:\codes\brick-bootkit-springboot\plugins
