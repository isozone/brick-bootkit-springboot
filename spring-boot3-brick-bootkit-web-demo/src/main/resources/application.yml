server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  thymeleaf:
    cache: false
    mode: HTML
  autoconfigure:
    exclude:
      # 排除 brick-bootkit 自动配置
      # 排除不需要的自动配置
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

logging:
  level:
    com.zqzqq.bootkits: INFO
    org.springframework.web: INFO
    org.springframework.boot: INFO


plugin:
  runMode: prod
  plugin-follow-log: true
  mainPackage: com.zqzqq.bootkits.web.demo.DemoApplication
  pluginPath:
    - D:\codes\brick-bootkit-springboot\plugins
