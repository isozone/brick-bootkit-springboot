server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  thymeleaf:
    cache: false
    mode: HTML
  autoconfigure:
    exclude:
      # 排除 brick-bootkit 自动配置
      # 排除不需要的自动配置
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

logging:
  level:
    com.zqzqq.bootkits: INFO
    org.springframework.web: INFO
    org.springframework.boot: INFO

# SpringDoc OpenAPI 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.xiaominfo.knife4j.demo.web
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn


plugin:
  enable: true
  runMode: prod
  plugin-follow-log: true
  mainPackage: com.zqzqq.bootkits.web.demo.DemoApplication
  pluginPath:
    - D:\codes\brick-bootkit-springboot\plugins
  #   - D:\codes\brick-bootkit-springboot\spring-boot3-brick-bootkit-web-demo\demo-test-upload-plus\target
  # 脚本管理配置
  scripts:
    storage:
      type: file
      file:
        data-path: ./scripts-data

