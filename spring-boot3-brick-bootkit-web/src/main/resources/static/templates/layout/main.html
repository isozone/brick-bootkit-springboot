<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Brick Web - 企业级插件管理系统">
    <meta name="keywords" content="插件管理,系统监控,脚本执行">
    <title>Brick Web - 企业级插件管理系统</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/brick-web/static/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/brick-web/static/lib/bootstrap-icons/font/bootstrap-icons.css">
    
    <!-- 自定义 CSS -->
    <link rel="stylesheet" href="/brick-web/static/css/brick-web.css">
    
    <!-- Vue.js -->
    <script src="/brick-web/static/lib/vue/js/vue.global.prod.js"></script>
</head>
<body>
    <!-- 移动端遮罩 -->
    <div class="brick-overlay" id="sidebar-overlay"></div>
    
    <div class="brick-wrapper">
        <!-- 侧边栏 -->
        <aside class="brick-sidebar" id="sidebar">
            <div class="brick-sidebar-header">
                <a href="/brick-web/index.html" class="brick-brand">
                    <div class="brick-brand-icon">
                        <i class="bi bi-box-seam"></i>
                    </div>
                    <span>Brick Web</span>
                </a>
            </div>
            
            <nav class="brick-sidebar-nav">
                <!-- 侧边栏菜单将由 Sidebar 组件动态渲染 -->
            </nav>
            
            <div class="brick-sidebar-footer">
                <div class="brick-user-info">
                    <div class="brick-user-avatar">
                        <span class="brick-avatar-text">B</span>
                    </div>
                    <div class="brick-user-details">
                        <div class="brick-user-name">Brick Admin</div>
                        <div class="brick-user-role">系统管理员</div>
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- 主内容区 -->
        <main class="brick-main">
            <!-- 顶部导航 -->
            <header class="brick-topbar">
                <div class="brick-topbar-left">
                    <button class="brick-toggle-sidebar" type="button" id="sidebar-toggle-btn">
                        <i class="bi bi-list"></i>
                    </button>
                    <nav class="brick-breadcrumb" id="breadcrumb-nav">
                        <!-- 面包屑将由 Topbar 组件动态渲染 -->
                    </nav>
                </div>
                
                <div class="brick-actions" id="topbar-actions">
                    <!-- 操作按钮将由 Topbar 组件动态渲染 -->
                </div>
            </header>
            
            <!-- 页面内容 -->
            <div class="brick-content" id="page-content">
                <!-- 子模板内容将在这里渲染 -->
                <slot></slot>
            </div>
            
            <!-- 页脚 -->
            <footer class="brick-footer">
                <div class="brick-footer-content">
                    <div class="brick-footer-left">
                        <span>&copy; 2024 Brick Web. All rights reserved.</span>
                    </div>
                    <div class="brick-footer-right">
                        <span class="me-3"><i class="bi bi-info-circle me-1"></i>v4.0.4</span>
                        <a href="https://github.com/v18268185209/brick-bootkit-springboot" target="_blank" class="brick-footer-link">
                            <i class="bi bi-github"></i> GitHub
                        </a>
                    </div>
                </div>
            </footer>
        </main>
    </div>
    
    <!-- 依赖脚本 -->
    <script src="/brick-web/static/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/brick-web/static/lib/axios/js/axios.min.js"></script>
    <script src="/brick-web/static/lib/sweetalert2/js/sweetalert2.all.min.js"></script>
    <script src="/brick-web/static/lib/echarts/js/echarts.min.js"></script>
    
    <!-- 通用脚本 -->
    <script src="/brick-web/static/js/brick-web.js"></script>
    
    <!-- 组件脚本 -->
    <script src="/brick-web/static/js/components/sidebar.js"></script>
    <script src="/brick-web/static/js/components/topbar.js"></script>
    
    <script>
        // 初始化侧边栏和顶部导航
        document.addEventListener('DOMContentLoaded', function() {
            // 获取当前页面ID（根据当前路径）
            const currentPath = window.location.pathname;
            let pageId = '';
            
            // 根据路径匹配页面ID
            if (currentPath.includes('/index.html')) pageId = 'dashboard';
            else if (currentPath.includes('/plugins/index.html')) pageId = 'plugins-list';
            else if (currentPath.includes('/plugins/upload.html')) pageId = 'plugins-upload';
            else if (currentPath.includes('/scripts/index.html')) pageId = 'scripts-list';
            else if (currentPath.includes('/scripts/editor.html')) pageId = 'scripts-editor';
            else if (currentPath.includes('/scripts/templates.html')) pageId = 'scripts-templates';
            else if (currentPath.includes('/scripts/executions.html')) pageId = 'scripts-executions';
            else if (currentPath.includes('/scripts/scheduler.html')) pageId = 'scripts-scheduler';
            else if (currentPath.includes('/monitor/overview.html')) pageId = 'monitor-overview';
            else if (currentPath.includes('/monitor/memory.html')) pageId = 'monitor-memory';
            else if (currentPath.includes('/monitor/cpu.html')) pageId = 'monitor-cpu';
            else if (currentPath.includes('/monitor/threads.html')) pageId = 'monitor-threads';
            
            // 初始化侧边栏
            if (window.Sidebar) {
                window.Sidebar.init(pageId);
            }
            
            // 初始化顶部导航
            if (window.Topbar) {
                // 根据当前页面设置面包屑
                const breadcrumbs = [
                    { label: '首页', href: '/brick-web/index.html' }
                ];
                
                // 根据页面ID添加面包屑
                if (pageId !== 'dashboard') {
                    const activeMenu = window.Sidebar.getActiveMenuItem();
                    if (activeMenu) {
                        breadcrumbs.push({ 
                            label: activeMenu.label, 
                            href: activeMenu.href 
                        });
                    }
                }
                
                window.Topbar.init({
                    breadcrumbs: breadcrumbs,
                    actions: []
                });
            }
        });
    </script>
</body>
</html>
