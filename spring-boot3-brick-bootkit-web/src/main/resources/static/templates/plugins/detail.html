<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插件详情 - Brick Web</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    
    <link rel="stylesheet" href="/brick-web/static/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/brick-web/static/lib/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/brick-web/static/css/brick-web.css">
    
    <script src="/brick-web/static/lib/vue/js/vue.global.prod.js"></script>
    <script src="/brick-web/static/lib/axios/js/axios.min.js"></script>
    <script src="/brick-web/static/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/brick-web/static/lib/sweetalert2/js/sweetalert2.all.min.js"></script>
    <script src="/brick-web/static/js/brick-web.js"></script>
</head>
<body>
    <div class="brick-wrapper">
        <aside class="brick-sidebar" id="sidebar">
            <div class="brick-sidebar-header">
                <a href="/brick-web/index.html" class="brick-brand">
                    <div class="brick-brand-icon">
                        <i class="bi bi-box-seam"></i>
                    </div>
                    <span>Brick Web</span>
                </a>
            </div>
            
            <nav class="brick-sidebar-nav">
                <div class="brick-nav-section">
                    <div class="brick-nav-section-title">概览</div>
                    <ul class="brick-nav">
                        <li class="brick-nav-item">
                            <a class="brick-nav-link" href="/brick-web/index.html">
                                <i class="bi bi-speedometer2"></i>
                                <span>仪表盘</span>
                            </a>
                        </li>
                    </ul>
                </div>
                
                <div class="brick-nav-section">
                    <div class="brick-nav-section-title">插件管理</div>
                    <ul class="brick-nav">
                        <li class="brick-nav-item">
                            <a class="brick-nav-link" href="/brick-web/plugins/index.html">
                                <i class="bi bi-plug"></i>
                                <span>插件列表</span>
                            </a>
                        </li>
                        <li class="brick-nav-item">
                            <a class="brick-nav-link active" href="/brick-web/plugins/upload.html">
                                <i class="bi bi-cloud-upload"></i>
                                <span>上传插件</span>
                            </a>
                        </li>
                    </ul>
                </div>
                
                <div class="brick-nav-section">
                    <div class="brick-nav-section-title">系统监控</div>
                    <ul class="brick-nav">
                        <li class="brick-nav-item">
                            <a class="brick-nav-link" href="/brick-web/monitor/overview.html">
                                <i class="bi bi-bar-chart-line"></i>
                                <span>监控概览</span>
                            </a>
                        </li>
                        <li class="brick-nav-item">
                            <a class="brick-nav-link" href="/brick-web/monitor/memory.html">
                                <i class="bi bi-memory"></i>
                                <span>内存监控</span>
                            </a>
                        </li>
                        <li class="brick-nav-item">
                            <a class="brick-nav-link" href="/brick-web/monitor/cpu.html">
                                <i class="bi bi-cpu"></i>
                                <span>CPU 监控</span>
                            </a>
                        </li>
                        <li class="brick-nav-item">
                            <a class="brick-nav-link" href="/brick-web/monitor/threads.html">
                                <i class="bi bi-gear"></i>
                                <span>线程监控</span>
                            </a>
                        </li>
                    </ul>
                </div>
                
                <div class="brick-nav-section">
                    <div class="brick-nav-section-title">文档</div>
                    <ul class="brick-nav">
                        <li class="brick-nav-item">
                            <a class="brick-nav-link" href="/doc.html" target="_blank">
                                <i class="bi bi-book"></i>
                                <span>API 文档</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
            
            <div class="brick-sidebar-footer">
                <div style="display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem;">
                    <div style="width: 2rem; height: 2rem; background: linear-gradient(135deg, var(--primary) 0%, var(--success) 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600;">
                        B
                    </div>
                    <div style="flex: 1;">
                        <div style="font-size: 0.875rem; font-weight: 500; color: #fff;">Brick Admin</div>
                        <div style="font-size: 0.75rem; color: rgba(255,255,255,0.5);">管理员</div>
                    </div>
                </div>
            </div>
        </aside>
        
        <main class="brick-main">
            <header class="brick-topbar">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="brick-toggle-sidebar" type="button" onclick="toggleSidebar()">
                        <i class="bi bi-list"></i>
                    </button>
                    <nav class="brick-breadcrumb">
                        <a href="/brick-web/index.html">首页</a>
                        <span class="brick-breadcrumb-separator">/</span>
                        <a href="/brick-web/plugins/index.html">插件列表</a>
                        <span class="brick-breadcrumb-separator">/</span>
                        <span class="brick-breadcrumb-item active">插件详情</span>
                    </nav>
                </div>
                
                <div class="brick-actions">
                    <a href="/brick-web/plugins/index.html" class="btn btn-secondary btn-sm me-2">
                        <i class="bi bi-arrow-left"></i>
                        <span class="d-none d-sm-inline">返回</span>
                    </a>
                    <div class="brick-time">
                        <i class="bi bi-clock"></i>
                        <span id="current-time"></span>
                    </div>
                </div>
            </header>
            
            <div class="brick-content" id="app">
                <!-- 加载状态 -->
                <div v-if="loading" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-3 text-muted">正在加载插件详情...</p>
                </div>
                
                <!-- 插件详情 -->
                <template v-if="!loading && plugin">
                    <div class="brick-page-header fade-in">
                        <div class="d-flex align-items-center gap-3">
                            <div class="plugin-detail-icon" :class="plugin.state?.toLowerCase()">
                                <i class="bi bi-box-seam"></i>
                            </div>
                            <div>
                                <h1 class="brick-page-title mb-1">{{ plugin.name || plugin.pluginId }}</h1>
                                <p class="brick-page-subtitle mb-0">
                                    <span class="me-3">{{ plugin.pluginId }}</span>
                                    <span class="brick-badge" :class="getStateClass(plugin.state)">
                                        {{ getStateText(plugin.state) }}
                                    </span>
                                </p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 基本信息 -->
                    <div class="row g-4 mb-4">
                        <div class="col-lg-8">
                            <div class="brick-card fade-in">
                                <div class="brick-card-header">
                                    <h5 class="mb-0">
                                        <i class="bi bi-info-circle me-2"></i>基本信息
                                    </h5>
                                </div>
                                <div class="brick-card-body">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="brick-info-label">插件ID</label>
                                            <div class="brick-info-value">{{ plugin.pluginId }}</div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="brick-info-label">插件名称</label>
                                            <div class="brick-info-value">{{ plugin.name || '-' }}</div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="brick-info-label">版本</label>
                                            <div class="brick-info-value">{{ plugin.version || '-' }}</div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="brick-info-label">作者</label>
                                            <div class="brick-info-value">{{ plugin.author || '-' }}</div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="brick-info-label">插件类型</label>
                                            <div class="brick-info-value">{{ plugin.pluginType || '-' }}</div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="brick-info-label">主类</label>
                                            <div class="brick-info-value">{{ plugin.mainClass || '-' }}</div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="brick-info-label">插件路径</label>
                                            <div class="brick-info-value" style="word-break: break-all;">
                                                <small>{{ plugin.pluginPath || '-' }}</small>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="brick-info-label">状态</label>
                                            <div class="brick-info-value">
                                                <span class="brick-badge" :class="getStateClass(plugin.state)">
                                                    {{ getStateText(plugin.state) }}
                                                </span>
                                                <span v-if="plugin.stateDescription" class="ms-2 text-muted small">
                                                    ({{ plugin.stateDescription }})
                                                </span>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="brick-info-label">启动时间</label>
                                            <div class="brick-info-value">{{ formatDateTime(plugin.startTime) || '-' }}</div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="brick-info-label">停止时间</label>
                                            <div class="brick-info-value">{{ formatDateTime(plugin.stopTime) || '-' }}</div>
                                        </div>
                                        <div class="col-12 mb-3">
                                            <label class="brick-info-label">描述</label>
                                            <div class="brick-info-value">{{ plugin.description || '暂无描述' }}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 依赖插件 -->
                            <div class="brick-card fade-in" v-if="plugin.dependentPlugins && plugin.dependentPlugins.length > 0">
                                <div class="brick-card-header">
                                    <h5 class="mb-0">
                                        <i class="bi bi-diagram-3 me-2"></i>依赖插件
                                        <span class="badge bg-secondary ms-2">{{ plugin.dependentPlugins.length }}</span>
                                    </h5>
                                </div>
                                <div class="brick-card-body p-0">
                                    <div class="table-responsive">
                                        <table class="brick-table mb-0">
                                            <thead>
                                                <tr>
                                                    <th>插件ID</th>
                                                    <th>版本要求</th>
                                                    <th>状态</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr v-for="dep in plugin.dependentPlugins" :key="dep.pluginId">
                                                    <td>{{ dep.pluginId }}</td>
                                                    <td>{{ dep.version || '任意版本' }}</td>
                                                    <td>
                                                        <span class="brick-badge" :class="getStateClass(dep.state)">
                                                            {{ getStateText(dep.state) }}
                                                        </span>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 扩展信息 -->
                            <div class="brick-card fade-in" v-if="plugin.extensionInfo && Object.keys(plugin.extensionInfo).length > 0">
                                <div class="brick-card-header">
                                    <h5 class="mb-0">
                                        <i class="bi bi-puzzle me-2"></i>扩展信息
                                        <span class="badge bg-secondary ms-2">{{ Object.keys(plugin.extensionInfo).length }}</span>
                                    </h5>
                                </div>
                                <div class="brick-card-body">
                                    <div class="row">
                                        <div class="col-md-6 mb-2" v-for="(value, key) in plugin.extensionInfo" :key="key">
                                            <label class="brick-info-label">{{ key }}</label>
                                            <div class="brick-info-value">
                                                <code class="small">{{ formatValue(value) }}</code>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 操作面板 -->
                        <div class="col-lg-4">
                            <div class="brick-card fade-in">
                                <div class="brick-card-header">
                                    <h5 class="mb-0">
                                        <i class="bi bi-gear me-2"></i>操作
                                    </h5>
                                </div>
                                <div class="brick-card-body">
                                    <div class="d-grid gap-2">
                                        <button class="btn btn-success" 
                                                v-if="plugin.state !== 'STARTED'"
                                                @click="startPlugin">
                                            <i class="bi bi-play-fill me-2"></i>启动插件
                                        </button>
                                        <button class="btn btn-warning" 
                                                v-if="plugin.state === 'STARTED'"
                                                @click="stopPlugin">
                                            <i class="bi bi-stop-fill me-2"></i>停止插件
                                        </button>
                                        <button class="btn btn-info" @click="restartPlugin">
                                            <i class="bi bi-arrow-repeat me-2"></i>重启插件
                                        </button>
                                        <button class="btn btn-outline-danger" @click="uninstallPlugin">
                                            <i class="bi bi-trash me-2"></i>卸载插件
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 插件性能统计 -->
                            <div class="brick-card fade-in" v-if="plugin.performance">
                                <div class="brick-card-header">
                                    <h5 class="mb-0">
                                        <i class="bi bi-speedometer2 me-2"></i>性能统计
                                    </h5>
                                </div>
                                <div class="brick-card-body">
                                    <div class="mb-3">
                                        <div class="d-flex justify-content-between mb-1">
                                            <span class="small text-muted">CPU 使用率</span>
                                            <span class="small fw-medium">{{ plugin.performance.cpuUsage || 0 }}%</span>
                                        </div>
                                        <div class="progress" style="height: 0.5rem;">
                                            <div class="progress-bar" :style="{ width: (plugin.performance.cpuUsage || 0) + '%' }"></div>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <div class="d-flex justify-content-between mb-1">
                                            <span class="small text-muted">内存使用</span>
                                            <span class="small fw-medium">{{ formatBytes(plugin.performance.memoryUsage) }}</span>
                                        </div>
                                        <div class="progress" style="height: 0.5rem;">
                                            <div class="progress-bar bg-success" :style="{ width: (plugin.performance.memoryUsage || 0) + '%' }"></div>
                                        </div>
                                    </div>
                                    <div>
                                        <div class="d-flex justify-content-between mb-1">
                                            <span class="small text-muted">线程数</span>
                                            <span class="small fw-medium">{{ plugin.performance.threadCount || 0 }}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
                
                <!-- 空状态 -->
                <div v-if="!loading && !plugin" class="brick-empty-state fade-in">
                    <i class="bi bi-exclamation-triangle brick-empty-state-icon"></i>
                    <div class="brick-empty-state-title">插件不存在</div>
                    <div class="brick-empty-state-text">无法找到该插件的详细信息</div>
                    <a href="/brick-web/plugins/index.html" class="btn btn-primary mt-3">
                        <i class="bi bi-arrow-left me-2"></i>返回插件列表
                    </a>
                </div>
            </div>
        </main>
    </div>
    
    <div class="brick-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    
    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        setInterval(updateTime, 1000);
        updateTime();
        
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }
        
        const { createApp, ref, onMounted } = Vue;
        
        createApp({
            setup() {
                const loading = ref(true);
                const plugin = ref(null);
                const pluginId = ref('');
                
                const loadPluginDetail = async () => {
                    // 从 URL 获取 pluginId
                    const urlParams = new URLSearchParams(window.location.search);
                    pluginId.value = urlParams.get('id');
                    
                    if (!pluginId.value) {
                        // 尝试从路径中获取
                        const pathParts = window.location.pathname.split('/');
                        pluginId.value = pathParts[pathParts.length - 2];
                    }
                    
                    if (!pluginId.value) {
                        loading.value = false;
                        return;
                    }
                    
                    try {
                        const response = await BrickWeb.api.get('/plugins/' + pluginId.value);
                        if (response.code === 200 && response.data) {
                            plugin.value = response.data;
                        }
                    } catch (error) {
                        console.error('Failed to load plugin detail:', error);
                    } finally {
                        loading.value = false;
                    }
                };
                
                const startPlugin = () => {
                    BrickWeb.confirm('启动插件', `确定要启动插件 "${pluginId.value}" 吗？`, async () => {
                        try {
                            const response = await BrickWeb.api.post('/plugins/' + pluginId.value + '/start');
                            if (response.code === 200) {
                                BrickWeb.toast('success', '插件启动成功');
                                loadPluginDetail();
                            } else {
                                BrickWeb.toast('error', response.message || '启动失败');
                            }
                        } catch (error) {
                            BrickWeb.toast('error', '插件启动失败');
                        }
                    });
                };
                
                const stopPlugin = () => {
                    BrickWeb.confirm('停止插件', `确定要停止插件 "${pluginId.value}" 吗？`, async () => {
                        try {
                            const response = await BrickWeb.api.post('/plugins/' + pluginId.value + '/stop');
                            if (response.code === 200) {
                                BrickWeb.toast('success', '插件停止成功');
                                loadPluginDetail();
                            } else {
                                BrickWeb.toast('error', response.message || '停止失败');
                            }
                        } catch (error) {
                            BrickWeb.toast('error', '插件停止失败');
                        }
                    });
                };
                
                const restartPlugin = () => {
                    BrickWeb.confirm('重启插件', `确定要重启插件 "${pluginId.value}" 吗？`, async () => {
                        try {
                            const response = await BrickWeb.api.post('/plugins/' + pluginId.value + '/restart');
                            if (response.code === 200) {
                                BrickWeb.toast('success', '插件重启成功');
                                loadPluginDetail();
                            } else {
                                BrickWeb.toast('error', response.message || '重启失败');
                            }
                        } catch (error) {
                            BrickWeb.toast('error', '插件重启失败');
                        }
                    });
                };
                
                const uninstallPlugin = () => {
                    BrickWeb.confirm('卸载插件', `确定要卸载插件 "${pluginId.value}" 吗？这将删除插件文件且无法恢复！`, async () => {
                        try {
                            const response = await BrickWeb.api.delete('/plugins/' + pluginId.value);
                            if (response.code === 200) {
                                BrickWeb.toast('success', '插件卸载成功');
                                window.location.href = '/brick-web/plugins/index.html';
                            } else {
                                BrickWeb.toast('error', response.message || '卸载失败');
                            }
                        } catch (error) {
                            BrickWeb.toast('error', '插件卸载失败');
                        }
                    });
                };
                
                const getStateText = (state) => {
                    const stateMap = {
                        'STARTED': '运行中',
                        'STOPPED': '已停止',
                        'LOADED': '已加载',
                        'FAILED': '异常'
                    };
                    return stateMap[state] || state || '未知';
                };
                
                const getStateClass = (state) => {
                    const classMap = {
                        'STARTED': 'brick-badge-success',
                        'STOPPED': 'brick-badge-secondary',
                        'LOADED': 'brick-badge-warning',
                        'FAILED': 'brick-badge-danger'
                    };
                    return classMap[state] || 'brick-badge-secondary';
                };
                
                const formatTime = (time) => {
                    return BrickWeb.formatTime(time);
                };
                
                const formatDateTime = (time) => {
                    if (!time) return null;
                    try {
                        const date = new Date(time);
                        return date.toLocaleString('zh-CN', {
                            year: 'numeric',
                            month: '2-digit',
                            day: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit',
                            second: '2-digit'
                        });
                    } catch (e) {
                        return time;
                    }
                };
                
                const formatValue = (value) => {
                    if (value === null || value === undefined) {
                        return '-';
                    }
                    if (typeof value === 'object') {
                        return JSON.stringify(value, null, 2);
                    }
                    if (typeof value === 'boolean') {
                        return value ? '是' : '否';
                    }
                    return String(value);
                };
                
                onMounted(() => {
                    loadPluginDetail();
                });
                
                return {
                    loading, plugin, pluginId,
                    loadPluginDetail, startPlugin, stopPlugin, restartPlugin, uninstallPlugin,
                    getStateText, getStateClass, formatTime, formatDateTime, formatValue
                };
            }
        }).mount('#app');
    </script>
    
    <style>
        .plugin-detail-icon {
            width: 4rem;
            height: 4rem;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: var(--gray-100);
            color: var(--gray-500);
        }
        
        .plugin-detail-icon.started {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }
        
        .plugin-detail-icon.stopped {
            background: var(--gray-100);
            color: var(--gray-500);
        }
        
        .plugin-detail-icon.failed {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }
        
        .brick-info-label {
            display: block;
            font-size: 0.75rem;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }
        
        .brick-info-value {
            font-size: 0.9375rem;
            color: var(--gray-900);
            font-weight: 500;
        }
    </style>
</body>
</html>
