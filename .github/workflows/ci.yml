name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (Skip Tests)
        run: bash mvnw -B -ntp -DskipTests -Djacoco.skip=true clean verify

  docs-website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-website/package-lock.json

      - name: Install Docs Dependencies
        working-directory: docs-website
        run: npm ci

      - name: Regenerate Config Index
        working-directory: docs-website
        run: npm run generate-config-index

      - name: Ensure Config Index Is Committed
        working-directory: docs-website
        run: git diff --exit-code -- src/content/generated-config-keys.json src/content/generated-config-keys.js

      - name: Generate Config Summary
        working-directory: docs-website
        run: npm run generate-config-summary

      - name: Upload Config Summary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-config-key-summary
          path: |
            docs-website/output/config-key-summary.json
            docs-website/output/config-key-summary.md
            docs-website/src/content/generated-config-keys.json

      - name: Verify Docs Integrity
        working-directory: docs-website
        run: npm run verify-docs

      - name: Build Docs Website
        working-directory: docs-website
        run: npm run build

  web-console-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: spring-boot3-brick-bootkit-web/vue3/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: spring-boot3-brick-bootkit-web/vue3
        run: npm ci

      - name: Run Frontend Unit Tests
        working-directory: spring-boot3-brick-bootkit-web/vue3
        run: npm test

      - name: Build Frontend
        working-directory: spring-boot3-brick-bootkit-web/vue3
        run: npm run build

      - name: Ensure Frontend Build Output Is Committed
        run: git diff --exit-code -- spring-boot3-brick-bootkit-web/src/main/resources/static/plugins-web

  unit-tests-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Unit Tests (Stable Modules)
        run: >
          bash mvnw -B -ntp
          -pl spring-boot3-brick-bootkit-loader,spring-boot3-brick-bootkit-core,spring-boot3-brick-bootkit,spring-boot3-brick-bootkit-web
          -am clean test

      - name: Upload Surefire Reports (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.txt
            **/target/surefire-reports/*.xml
